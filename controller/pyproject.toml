[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surge-prep-controller"
version = "0.1.0"
description = "Scalpel controller boundary for Surge Prep"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/scalpel_controller"]

